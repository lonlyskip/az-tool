name: Build and publish az Tool for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - az-tool-rebuild
    paths:
      - "az_tool.py"
      - "requirements.txt"
      - "make_icon.py"
      - "tests/**"
      - "IMG_4552.jpg"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka zstandard

      - name: Compile source syntax
        run: python -m compileall -q az_tool.py make_icon.py tests

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Generate application icon
        run: python make_icon.py

      - name: Verify generated icon assets
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/az-tool-icon.ico")) { throw "ICO icon was not generated." }
          if (-not (Test-Path "assets/az-tool-icon.png")) { throw "PNG icon was not generated." }
          if ((Get-Item "assets/az-tool-icon.ico").Length -lt 1024) { throw "ICO icon is unexpectedly small." }

      - name: Compile Windows application (standalone folder)
        run: >-
          python -m nuitka --mode=standalone --windows-console-mode=disable
          --output-dir=build
          --assume-yes-for-downloads
          --company-name="NEXORA"
          --product-name="AZ Tool"
          --file-description="AZ Tool - Desktop Application"
          --file-version="1.0.${{ github.run_number }}.0"
          --product-version="1.0.${{ github.run_number }}.0"
          --enable-plugin=tk-inter
          --include-package=rapidocr_onnxruntime
          --include-package-data=rapidocr_onnxruntime
          --include-package=onnxruntime
          --include-data-files=assets/az-tool-icon.ico=az-tool-icon.ico
          --include-data-files=IMG_4552.jpg=IMG_4552.jpg
          --output-filename="az tool.exe"
          az_tool.py

      - name: Validate PE executable and calculate SHA-256
        id: verify
        shell: pwsh
        run: |
          $distDir = "build/az_tool.dist"
          $builtExe = Join-Path $distDir "az tool.exe"
          $exe = $builtExe
          if (-not (Test-Path $distDir -PathType Container)) { throw "Nuitka standalone runtime folder was not created." }
          if (-not (Test-Path $builtExe -PathType Leaf)) { throw "Standalone executable was not created." }
          $file = Get-Item $exe
          if ($file.Length -lt 10MB) { throw "Executable is unexpectedly small ($($file.Length) bytes)." }
          $stream = [System.IO.File]::OpenRead((Resolve-Path $exe))
          try {
            $reader = New-Object System.IO.BinaryReader($stream)
            if ($reader.ReadUInt16() -ne 0x5A4D) { throw "Missing MZ DOS header." }
            $stream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            if ($peOffset -lt 64 -or $peOffset -gt ($stream.Length - 6)) { throw "Invalid PE header offset." }
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) { throw "Missing PE signature." }
            $machine = $reader.ReadUInt16()
            if ($machine -ne 0x8664) { throw "Unexpected PE machine type: $machine (expected x64)." }
          } finally { $stream.Dispose() }
          $version = $file.VersionInfo
          if ($version.ProductName -ne "AZ Tool") { throw "Unexpected ProductName: $($version.ProductName)" }
          if ($version.CompanyName -ne "NEXORA") { throw "Unexpected CompanyName: $($version.CompanyName)" }
          $expectedVersion = "1.0.${{ github.run_number }}.0"
          if ($version.ProductVersion -ne $expectedVersion) { throw "Unexpected ProductVersion: $($version.ProductVersion)" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "## AZ Tool build verification" >> $env:GITHUB_STEP_SUMMARY
          "- File: az tool.exe" >> $env:GITHUB_STEP_SUMMARY
          "- Size: $($file.Length) bytes" >> $env:GITHUB_STEP_SUMMARY
          "- Product version: $($version.ProductVersion)" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Create clean launcher and ZIP package
        shell: pwsh
        run: |
          $zip = "AZ-Tool-Windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $packageDir = "build/AZ-Tool-Windows"
          $runtimeDir = Join-Path $packageDir "runtime"
          if (Test-Path $packageDir) { Remove-Item $packageDir -Recurse -Force }
          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
          Get-ChildItem -LiteralPath "build/az_tool.dist" | Move-Item -Destination $runtimeDir
          $runtimeExe = Join-Path $runtimeDir "az tool.exe"
          if (-not (Test-Path $runtimeExe -PathType Leaf)) { throw "Runtime executable missing." }
          Rename-Item -LiteralPath $runtimeExe -NewName "az-tool-core.exe"
          if (-not (Test-Path (Join-Path $runtimeDir "python311.dll"))) { throw "python311.dll missing beside runtime executable." }
          if (-not (Test-Path (Join-Path $runtimeDir "IMG_4552.jpg"))) { throw "Background image missing from runtime folder." }

          $launcherSource = @'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Reflection;
          using System.Windows.Forms;

          [assembly: AssemblyTitle("AZ Tool")]
          [assembly: AssemblyProduct("AZ Tool")]
          [assembly: AssemblyCompany("NEXORA")]

          internal static class Launcher {
              [STAThread]
              private static int Main() {
                  string root = AppDomain.CurrentDomain.BaseDirectory;
                  string runtime = Path.Combine(root, "runtime");
                  string app = Path.Combine(runtime, "az-tool-core.exe");
                  if (!File.Exists(app)) {
                      MessageBox.Show("AZ Tool runtime files are missing. Please extract the complete folder before running.", "AZ Tool", MessageBoxButtons.OK, MessageBoxIcon.Error);
                      return 1;
                  }
                  var start = new ProcessStartInfo(app);
                  start.WorkingDirectory = runtime;
                  start.UseShellExecute = false;
                  string oldPath = start.EnvironmentVariables["PATH"] ?? "";
                  start.EnvironmentVariables["PATH"] = runtime + ";" + oldPath;
                  try {
                      using (Process child = Process.Start(start)) {
                          child.WaitForExit();
                          return child.ExitCode;
                      }
                  } catch (Exception ex) {
                      MessageBox.Show("AZ Tool could not start: " + ex.Message, "AZ Tool", MessageBoxButtons.OK, MessageBoxIcon.Error);
                      return 1;
                  }
              }
          }
          '@
          $launcherSourcePath = Join-Path (Get-Location).Path "build/launcher.cs"
          Set-Content -LiteralPath $launcherSourcePath -Value $launcherSource -Encoding UTF8

          $csc = Join-Path $env:WINDIR "Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          if (-not (Test-Path $csc -PathType Leaf)) { throw "C# compiler not found: $csc" }

          # csc.exe treats slash-prefixed relative paths as compiler switches.
          # Resolve source and output paths to absolute Windows paths first.
          $launcherSourcePath = (Resolve-Path -LiteralPath $launcherSourcePath).Path
          $launcher = Join-Path (Resolve-Path -LiteralPath $packageDir).Path "az tool.exe"
          $iconPath = (Resolve-Path -LiteralPath "assets/az-tool-icon.ico").Path

          $compilerArgs = @(
            "/nologo"
            "/target:winexe"
            "/platform:x64"
            "/optimize+"
            "/win32icon:$iconPath"
            "/out:$launcher"
            "/reference:System.Windows.Forms.dll"
            $launcherSourcePath
          )
          & $csc @compilerArgs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw "Launcher compilation failed (csc exit code: $LASTEXITCODE)."
          }

          Compress-Archive -LiteralPath $packageDir -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip -PathType Leaf)) { throw "ZIP package was not created." }
          "## ZIP package" >> $env:GITHUB_STEP_SUMMARY
          "- Archive: $zip" >> $env:GITHUB_STEP_SUMMARY
          "- Contains: az tool.exe launcher and runtime/ folder with the application, Python DLLs, and background image" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload ZIP build artifact
        uses: actions/upload-artifact@v4
        with:
          name: az-tool-windows-zip
          path: "AZ-Tool-Windows.zip"
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "az-tool-build-${{ github.run_number }}"
          $notes = @"
          Windows ZIP package with executable and required runtime folder.
          File: AZ-Tool-Windows.zip
          Contents: AZ-Tool-Windows/ (az tool.exe launcher + runtime/ subfolder)
          Product version: 1.0.${{ github.run_number }}.0
          SHA-256: ${{ steps.verify.outputs.sha256 }}

          This build is not Authenticode-signed. Windows may show an Unknown publisher warning. Antivirus detections are not ruled out by successful build validation.
          "@
          gh release create $tag "AZ-Tool-Windows.zip" --title "az Tool Windows build ${{ github.run_number }}" --notes $notes
