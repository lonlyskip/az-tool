name: Build az tool for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - az-tool-rebuild
    paths:
      - "az_tool.py"
      - "requirements.txt"
      - "make_icon.py"
      - "IMG_4552.jpg"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka zstandard

      - name: Generate feather icon
        run: python make_icon.py

      - name: Compile single-file Windows application
        run: >-
          python -m nuitka --mode=onefile --windows-console-mode=disable
          --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --include-package=rapidocr_onnxruntime
          --include-package-data=rapidocr_onnxruntime
          --include-package=onnxruntime
          --include-data-files=assets/az-tool-icon.ico=az-tool-icon.ico
          --include-data-files=IMG_4552.jpg=IMG_4552.jpg
          --output-filename="az tool.exe"
          az_tool.py

      - name: Upload the EXE only
        uses: actions/upload-artifact@v4
        with:
          name: az-tool-windows
          path: "az tool.exe"
          if-no-files-found: error
          retention-days: 14
