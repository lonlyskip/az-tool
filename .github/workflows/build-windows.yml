name: Build and publish az Tool for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - az-tool-rebuild
    paths:
      - "az_tool.py"
      - "requirements.txt"
      - "make_icon.py"
      - "tests/**"
      - "IMG_4552.jpg"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka zstandard

      - name: Compile source syntax
        run: python -m compileall -q az_tool.py make_icon.py tests

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Generate application icon
        run: python make_icon.py

      - name: Verify generated icon assets
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/az-tool-icon.ico")) { throw "ICO icon was not generated." }
          if (-not (Test-Path "assets/az-tool-icon.png")) { throw "PNG icon was not generated." }
          if ((Get-Item "assets/az-tool-icon.ico").Length -lt 1024) { throw "ICO icon is unexpectedly small." }

      - name: Compile Windows application (standalone folder)
        run: >-
          python -m nuitka --mode=standalone --windows-console-mode=disable
          --output-dir=build
          --assume-yes-for-downloads
          --company-name="NEXORA"
          --product-name="AZ Tool"
          --file-description="AZ Tool - Desktop Application"
          --file-version="1.0.${{ github.run_number }}.0"
          --product-version="1.0.${{ github.run_number }}.0"
          --enable-plugin=tk-inter
          --include-package=rapidocr_onnxruntime
          --include-package-data=rapidocr_onnxruntime
          --include-package=onnxruntime
          --include-data-files=assets/az-tool-icon.ico=az-tool-icon.ico
          --include-data-files=IMG_4552.jpg=IMG_4552.jpg
          --output-filename="az tool.exe"
          az_tool.py

      - name: Validate PE executable and calculate SHA-256
        id: verify
        shell: pwsh
        run: |
          $distDir = "build/az tool.dist"
          $builtExe = Join-Path $distDir "az tool.exe"
          $exe = "build/az tool.exe"
          if (-not (Test-Path $distDir -PathType Container)) { throw "Nuitka standalone runtime folder was not created." }
          if (-not (Test-Path $builtExe -PathType Leaf)) { throw "Standalone executable was not created." }
          Move-Item -LiteralPath $builtExe -Destination $exe
          $file = Get-Item $exe
          if ($file.Length -lt 10MB) { throw "Executable is unexpectedly small ($($file.Length) bytes)." }
          $stream = [System.IO.File]::OpenRead((Resolve-Path $exe))
          try {
            $reader = New-Object System.IO.BinaryReader($stream)
            if ($reader.ReadUInt16() -ne 0x5A4D) { throw "Missing MZ DOS header." }
            $stream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            if ($peOffset -lt 64 -or $peOffset -gt ($stream.Length - 6)) { throw "Invalid PE header offset." }
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) { throw "Missing PE signature." }
            $machine = $reader.ReadUInt16()
            if ($machine -ne 0x8664) { throw "Unexpected PE machine type: $machine (expected x64)." }
          } finally { $stream.Dispose() }
          $version = $file.VersionInfo
          if ($version.ProductName -ne "AZ Tool") { throw "Unexpected ProductName: $($version.ProductName)" }
          if ($version.CompanyName -ne "NEXORA") { throw "Unexpected CompanyName: $($version.CompanyName)" }
          $expectedVersion = "1.0.${{ github.run_number }}.0"
          if ($version.ProductVersion -ne $expectedVersion) { throw "Unexpected ProductVersion: $($version.ProductVersion)" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "## AZ Tool build verification" >> $env:GITHUB_STEP_SUMMARY
          "- File: az tool.exe" >> $env:GITHUB_STEP_SUMMARY
          "- Size: $($file.Length) bytes" >> $env:GITHUB_STEP_SUMMARY
          "- Product version: $($version.ProductVersion)" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Create ZIP package
        shell: pwsh
        run: |
          $zip = "AZ-Tool-Windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -LiteralPath "build/az tool.exe","build/az tool.dist" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip -PathType Leaf)) { throw "ZIP package was not created." }
          "## ZIP package" >> $env:GITHUB_STEP_SUMMARY
          "- Archive: $zip" >> $env:GITHUB_STEP_SUMMARY
          "- Contains: az tool.exe and az tool.dist runtime directory" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload ZIP build artifact
        uses: actions/upload-artifact@v4
        with:
          name: az-tool-windows-zip
          path: "AZ-Tool-Windows.zip"
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "az-tool-build-${{ github.run_number }}"
          $notes = @"
          Windows ZIP package with executable and required runtime folder.
          File: AZ-Tool-Windows.zip
          Contents: az tool.exe + az tool.dist/
          Product version: 1.0.${{ github.run_number }}.0
          SHA-256: ${{ steps.verify.outputs.sha256 }}

          This build is not Authenticode-signed. Windows may show an Unknown publisher warning. Antivirus detections are not ruled out by successful build validation.
          "@
          gh release create $tag "AZ-Tool-Windows.zip" --title "az Tool Windows build ${{ github.run_number }}" --notes $notes
